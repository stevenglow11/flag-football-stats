<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brick Elite Flag Stats</title>
  <meta name="description" content="Live flag football stat tracker for Brick Elite. Works offline on your phone.">
  <meta name="theme-color" content="#f6efe6">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Flag Stats">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    (function () {
      try {
        var raw = localStorage.getItem("ffstats.v1");
        var theme = raw ? JSON.parse(raw).theme : null;
        var dark = theme === "dark" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#140e0c" : "#f6efe6");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app" class="app"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
